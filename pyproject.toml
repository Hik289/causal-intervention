[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "civer"
dynamic = ["version"]
description = "Causal Intervention Verification for Reliable Code Review"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["civic*", "scripts*", "tools*"]
